name: Daily Automated Stock Data Sync & Recompile

on:
  schedule:
    # 1. Asian Market Close (Taiwan TWSE/TPEx, Japan TSE, Korea KRX): 06:30 UTC = 14:30 Taipei / 15:30 Tokyo
    - cron: '30 6 * * 1-5'
    # 2. US & European Market Close: 22:00 UTC = 18:00 EST / 06:00 (+1d) Taipei
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance numpy

      - name: Fetch Latest Stock Market Data & Compute Moving Averages
        run: |
          python fetch_stock_data.py --all

      - name: Validate Corporate Benchmark Metrics
        run: |
          python .agents/skills/financial-report-multiformat-analyzer/scripts/validate_company.py all

      - name: Recompile Standalone Dashboard for GitHub Pages
        run: |
          python export_standalone.py

      - name: Commit and Push Updated Stock Intelligence
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_data.json docs/index.html standalone_dashboard.html
          if git diff --staged --quiet; then
            echo "No stock changes detected; skipping commit."
          else
            git commit -m "🤖 [Automated] Daily stock market update & MA20/MA60 recalculation"
            git push origin main
          fi
